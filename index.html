<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dearly - 나의 기록</title>
    <link rel="stylesheet" href="style (1).css">
    <!-- 자바스크립트는 외부 파일로 분리되어 관리됩니다 -->
    <script src="script (1).js" defer></script>
</head>
<body>
    <!-- 상단 메뉴 -->
    <header class="header">
        <h1 class="logo">
        <a href="index.html" style="text-decoration: none; color: inherit;">Dearly.</a>
        </h1>

        <nav class="menu">
            <a href="index.html" class="active">HoMe</a>
            <a href="plan.html">PlAn</a>
            <a href="diary.html">DiArY</a>
            <a href="list.html">LiSt</a>
        </nav>

        <div class="header-actions">
            <button class="write-button" onclick="location.href='write.html'">
                + 오늘의 일기 쓰기
            </button>

            <button class="icon-button" id="lockButton" title="비밀 일기" onclick="location.href='secretdiary.html'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </button>

            <button class="icon-button" id="trashButton" title="감정 쓰레기통" onclick="location.href='trash.html'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- 캘린더 영역 (주간 / 월간) -->
        <section class="calendar-section">
            <div class="calendar-toolbar">
                <div class="calendar-nav">
                    <button id="prevBtn" class="cal-arrow" aria-label="이전">&#10094;</button>
                    <h3 id="calendarLabel" class="calendar-label"></h3>
                    <button id="nextBtn" class="cal-arrow" aria-label="다음">&#10095;</button>
                </div>
                <button id="toggleViewBtn" class="toggle-view-button">월간 보기</button>
            </div>

            <!-- 요일 헤더 (주간/월간 공용) -->
            <div class="calendar-weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span>
                <span>목</span><span>금</span><span>토</span>
            </div>

            <!-- 주간 캘린더 -->
            <div id="weekView" class="week-view"></div>

            <!-- 월간 캘린더 -->
            <div id="monthView" class="month-view" style="display:none;">
                <div id="monthGrid" class="month-grid"></div>
            </div>
        </section>

        <!-- 소개 영역 -->
        <section class="hero">
            <p class="subtitle">YOUR NOTES, YOUR STORIES</p>
            <h2>나의 생각이 기록이 되는 곳</h2>
            <p>일상의 소소한 이야기부터 특별한 순간까지.</p>
        </section>

        <!-- 게시글 영역 -->
        <section id="posts">
            <div class="section-header">
                <div>
                    <h2>최신 공개 글</h2>
                    <p>다른 사람들과 함께 나누는 이야기</p>
                </div>
                <span id="post-count"></span>
            </div>

            <!-- JavaScript가 게시글 카드를 생성하는 영역 -->
            <div id="post-list" class="post-list"></div>
        </section>
    </main>

    <footer>
        <p>Dearly. &copy; 2026</p>
    </footer>
</body>
</html>
