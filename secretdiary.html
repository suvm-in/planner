<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dearly - 비밀 일기</title>
    <style>
/* 기본 설정 */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background-color: #f6f8f0;
    color: #252522;
}

/* 상단 메뉴 */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 7%;
    background-color: white;
    border-bottom: 1px solid #dce5d0;
}

.logo {
    color: #5f7a3e;
    margin: 0;
    font-size: 28px;
}

.menu {
    display: flex;
    gap: 28px;
}

.menu a {
    color: #666;
    text-decoration: none;
}

.menu a:hover,
.menu a.active {
    color: #5f7a3e;
}

/* 헤더 오른쪽 액션 영역 (글쓰기 / 비밀일기 / 감정쓰레기통) */
.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* 버튼 */
.write-button {
    background-color: #5f7a3e;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    white-space: nowrap;
}

.write-button:hover {
    background-color: #46602b;
}

/* 아이콘 버튼 (자물쇠 / 쓰레기통) */
.icon-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: 1px solid #dce5d0;
    border-radius: 8px;
    background-color: white;
    color: #666;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}

.icon-button:hover {
    background-color: #eef3e1;
    border-color: #c3d1a4;
    color: #5f7a3e;
}

/* 본문 */
.container {
    width: 86%;
    max-width: 1100px;
    margin: 40px auto;
}

/* ===================== 캘린더 영역 ===================== */
.calendar-section {
    background-color: white;
    border: 1px solid #dce5d0;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 30px;
}

.calendar-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
}

.calendar-nav {
    display: flex;
    align-items: center;
    gap: 14px;
}

.cal-arrow {
    background: none;
    border: none;
    font-size: 16px;
    color: #5f7a3e;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
}

.cal-arrow:hover {
    background-color: #eef3e1;
}

.calendar-label {
    margin: 0;
    font-size: 17px;
    min-width: 210px;
    text-align: center;
}

.toggle-view-button {
    background-color: #eef3e1;
    color: #5f7a3e;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
}

.toggle-view-button:hover {
    background-color: #dde6c8;
}

/* 요일 헤더 (주간/월간 공용) */
.calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #999;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid #ddd9cc;
    border-bottom: none;
    background-color: #f3f1ea;
}

.calendar-weekdays span {
    padding: 10px 0;
    border-right: 1px solid #ddd9cc;
}

.calendar-weekdays span:last-child {
    border-right: none;
}

.calendar-weekdays span:first-child {
    color: #e65050;
}

.calendar-weekdays span:last-child {
    color: #5f7a3e;
}

/* 주간 뷰: 표(table) 모양 - 셀 사이 테두리로 구분 */
.week-view {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1px solid #ddd9cc;
    border-top: none;
}

.day-cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 0 22px;
    background-color: white;
    border-right: 1px solid #ddd9cc;
    min-height: 76px;
}

.day-cell:last-child {
    border-right: none;
}

.day-cell.today {
    background-color: #5f7a3e;
    color: white;
}

.day-weekday {
    font-size: 12px;
    color: #999;
}

.day-cell.sunday .day-number {
    color: #e65050;
}

.day-cell.saturday .day-number {
    color: #5f7a3e;
}

.day-number {
    font-size: 18px;
    font-weight: bold;
}

.day-cell.today .day-number {
    color: white;
}

.day-dot {
    position: absolute;
    bottom: 6px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #5f7a3e;
}

.day-cell.today .day-dot {
    background-color: white;
}

/* 월간 뷰: 표(table) 모양 - 셀 사이 테두리로 구분 */
.month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 56px;
    border: 1px solid #ddd9cc;
    border-top: none;
}

.month-cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: white;
    border-right: 1px solid #ddd9cc;
    border-bottom: 1px solid #ddd9cc;
    font-size: 13px;
}

.month-cell:nth-child(7n) {
    border-right: none;
}

.month-cell.other-month {
    color: #ccc;
    background-color: #f6f8f0;
}

.month-cell.today {
    background-color: #5f7a3e;
    color: white;
}

.month-cell .day-dot {
    position: absolute;
    bottom: 6px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background-color: #5f7a3e;
}

.month-cell.today .day-dot {
    background-color: white;
}

/* 소개 영역 */
.hero {
    background-color: #eef3e1;
    border-radius: 14px;
    padding: 45px 35px;
    margin-bottom: 40px;
}

.subtitle {
    color: #5f7a3e;
    font-size: 12px;
    letter-spacing: 2px;
}

.hero h2 {
    font-size: 32px;
    margin-bottom: 12px;
}

.hero p {
    line-height: 1.7;
}

/* 게시글 제목 영역 */
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.section-header h2 {
    margin-bottom: 8px;
}

.section-header p {
    color: #777;
    font-size: 14px;
    margin-top: 0;
}

/* 게시글 카드 */
.post-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.post-card {
    background-color: white;
    border: 1px solid #dbe5d2;
    border-radius: 10px;
    padding: 24px;
    transition: transform 0.2s;
}

.post-card:hover {
    transform: translateY(-4px);
}

.category {
    color: #5f7a3e;
    font-size: 12px;
}

.post-card h3 {
    font-size: 19px;
    margin: 18px 0 12px;
}

.post-content {
    color: #666;
    font-size: 14px;
    line-height: 1.7;
}

.post-date {
    color: #999;
    font-size: 12px;
    margin-top: 24px;
}

/* 글쓰기 폼 (write.html) */
.write-section {
    background-color: white;
    border: 1px solid #dce5d0;
    border-radius: 14px;
    padding: 32px;
    margin-bottom: 30px;
}

.write-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 10px;
}

.write-form select,
.write-form input[type="text"],
.write-form textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #dce5d0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: #252522;
    background-color: #f6f8f0;
}

.write-form select:focus,
.write-form input[type="text"]:focus,
.write-form textarea:focus {
    outline: none;
    border-color: #5f7a3e;
    background-color: white;
}

.write-form textarea {
    resize: vertical;
    line-height: 1.7;
}

.write-form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
}

.cancel-button {
    background-color: white;
    color: #777;
    border: 1px solid #dce5d0;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
}

.cancel-button:hover {
    background-color: #f6f8f0;
}

.write-button.active {
    opacity: 0.6;
    cursor: default;
}

/* 준비중 안내 (plan.html 등 스켈레톤 페이지용) */
.placeholder-box {
    background-color: white;
    border: 1px dashed #c3d1a4;
    border-radius: 14px;
    padding: 60px 30px;
    text-align: center;
    color: #777;
}

.placeholder-box h2 {
    color: #5f7a3e;
    margin-bottom: 10px;
}

/* 하단 */
footer {
    text-align: center;
    padding: 30px;
    color: #999;
    font-size: 12px;
}

/* 모바일 화면 */
@media (max-width: 700px) {
    .header {
        flex-wrap: wrap;
        gap: 16px;
    }

    .menu {
        gap: 14px;
    }

    .header-actions {
        gap: 6px;
    }

    .container {
        width: 90%;
    }

    .hero h2 {
        font-size: 25px;
    }

    .post-list {
        grid-template-columns: 1fr;
    }

    .calendar-toolbar {
        justify-content: center;
    }

    .calendar-label {
        min-width: auto;
        font-size: 14px;
    }

    .day-number {
        font-size: 14px;
    }

    .month-cell {
        height: 40px;
        font-size: 11px;
    }
}


/* =====================================================
   다이어리 페이지 전용 (양피지 / 싸이월드 감성)
   body.diary-page 안에서만 적용되므로
   index.html, 3.html, write.html에는 영향 없음
   ===================================================== */

/* 페이지 전체 배경: 말차색 종이 질감 (이미지 없이 그라디언트로 표현) */
body.diary-page {
    font-family: "Gowun Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
    background-color: #dfe4c4;
    background-image:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.25), transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(90, 110, 50, 0.18), transparent 45%),
        repeating-linear-gradient(
            0deg,
            rgba(90, 110, 50, 0.04),
            rgba(90, 110, 50, 0.04) 2px,
            transparent 2px,
            transparent 4px
        );
    color: #3c4a28;
}

/* 헤더는 기존 톤을 유지하되 살짝 말차빛으로 */
body.diary-page .header {
    background-color: #f2f5e2;
    border-bottom: 1px solid #c3cf9c;
}

body.diary-page .menu a {
    color: #7c8a5c;
}

body.diary-page .menu a:hover,
body.diary-page .menu a.active {
    color: #5f7a3e;
}

body.diary-page .write-button {
    background-color: #5f7a3e;
}

body.diary-page .write-button:hover {
    background-color: #46602b;
}

/* 표지 영역: 양피지 가죽 노트 표지처럼 (베이지 종이색 유지) */
body.diary-page .diary-cover {
    background: linear-gradient(135deg, #f7ecd1, #ead9ab);
    border: 1px solid #c9b07f;
    border-radius: 10px;
    box-shadow:
        inset 0 0 0 6px #fbf6e8,
        inset 0 0 40px rgba(139, 90, 43, 0.15),
        0 6px 18px rgba(58, 74, 38, 0.25);
    position: relative;
}

/* 표지 모서리 닳은 느낌 */
body.diary-page .diary-cover::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background:
        radial-gradient(circle at 0% 0%, rgba(139, 90, 43, 0.25), transparent 25%),
        radial-gradient(circle at 100% 100%, rgba(139, 90, 43, 0.2), transparent 25%);
    pointer-events: none;
}

body.diary-page .diary-cover .subtitle {
    color: #a1712f;
    letter-spacing: 3px;
}

body.diary-page .diary-cover h2 {
    color: #5a4322;
    font-size: 30px;
}

body.diary-page .diary-cover p {
    color: #6f5b3a;
}

body.diary-page .section-header h2 {
    color: #3c4a28;
}

body.diary-page .section-header p,
body.diary-page #post-count {
    color: #7c8a5c;
}

/* 게시글 카드: 양피지 낱장 종이 느낌 + 살짝 비뚤어진 스크랩북 배치 (베이지 종이색 유지) */
body.diary-page .post-card {
    background-color: #fdf8ec;
    background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 27px,
        rgba(139, 111, 71, 0.08) 28px
    );
    border: 1px solid #d8c196;
    border-radius: 2px;
    box-shadow:
        0 2px 4px rgba(74, 58, 36, 0.15),
        0 10px 16px rgba(74, 58, 36, 0.12);
    position: relative;
}

/* 종이 귀퉁이가 살짝 접힌 느낌 (뒤로 보이는 배경은 말차색 페이지) */
body.diary-page .post-card::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 22px;
    height: 22px;
    background: linear-gradient(135deg, transparent 50%, #dfe4c4 50%);
    box-shadow: -2px -2px 4px rgba(74, 58, 36, 0.15);
}

/* 카드마다 번갈아 살짝 기울여 스크랩북처럼 */
body.diary-page .post-card:nth-child(odd) {
    transform: rotate(-1deg);
}

body.diary-page .post-card:nth-child(even) {
    transform: rotate(1deg);
}

body.diary-page .post-card:hover {
    transform: translateY(-4px) rotate(0deg);
}

body.diary-page .category {
    color: #a1712f;
    font-weight: bold;
}

body.diary-page .post-card h3 {
    color: #4a3a24;
}

body.diary-page .post-content {
    color: #5a4a30;
}

body.diary-page .post-date {
    color: #a1916f;
}

body.diary-page footer {
    color: #8a9770;
}

</style>
    <script>
const posts = [
    {
        id: 1,
        category: "일상",
        title: "오늘의 노을이 정말 예뻤다",
        content: "하루가 끝나가는 시간이 이렇게 아름다울 줄이야. 오랜만에 마음이 편안해졌다.",
        date: "2026.10.25"
    },
    {
        id: 2,
        category: "생각",
        title: "새로운 시작을 준비하며",
        content: "지금까지 해온 것들을 돌아보며 앞으로 더 좋은 방향으로 나아가고 싶다.",
        date: "2026.10.24"
    },
    {
        id: 3,
        category: "여행",
        title: "주말에 다녀온 작은 여행",
        content: "맑은 공기와 푸른 나무 덕분에 일상의 스트레스를 잠시 잊을 수 있었다.",
        date: "2026.10.22"
    }
];

// HTML 요소 선택
const postList = document.querySelector("#post-list");
const postCount = document.querySelector("#post-count");

// 게시글 영역이 있는 페이지(index.html, list.html 등)에서만 실행
if (postList) {
    if (postCount) {
        // 게시글 개수 표시
        postCount.textContent = `총 ${posts.length}개의 글`;
    }

    // 게시글 카드 생성
    posts.forEach(function(post) {
        // 카드 요소 생성
        const card = document.createElement("article");
        card.className = "post-card";

        // 카테고리
        const category = document.createElement("span");
        category.className = "category";
        category.textContent = post.category;

        // 제목
        const title = document.createElement("h3");
        title.textContent = post.title;

        // 본문
        const content = document.createElement("p");
        content.className = "post-content";
        content.textContent = post.content;

        // 작성일
        const date = document.createElement("p");
        date.className = "post-date";
        date.textContent = post.date;

        // 카드에 요소 추가
        card.append(category, title, content, date);

        // 게시글 목록에 카드 추가
        postList.appendChild(card);
    });
}


// 글쓰기 페이지
const writeForm = document.querySelector("#write-form");

if (writeForm) {
    writeForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const newPost = {
            id: Date.now(),
            category: document.querySelector("#category").value,
            title: document.querySelector("#title").value,
            content: document.querySelector("#content").value,
            date: new Date().toLocaleDateString("ko-KR")
        };

        posts.push(newPost);

        localStorage.setItem("posts", JSON.stringify(posts));

        alert("글이 등록되었습니다!");

        location.href = "index.html";
    });
}


// ===================== 캘린더 (주간 / 월간) =====================
const weekView = document.querySelector("#weekView");
const monthView = document.querySelector("#monthView");
const monthGrid = document.querySelector("#monthGrid");
const calendarLabel = document.querySelector("#calendarLabel");
const prevBtn = document.querySelector("#prevBtn");
const nextBtn = document.querySelector("#nextBtn");
const toggleViewBtn = document.querySelector("#toggleViewBtn");

// 캘린더 요소가 있는 페이지(메인 페이지)에서만 실행
if (weekView && monthView && monthGrid && calendarLabel && prevBtn && nextBtn && toggleViewBtn) {

    const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];

    let viewMode = "week";          // "week" | "month"
    let currentDate = new Date();   // 현재 보고 있는 기준 날짜

    // 날짜 비교 (연/월/일만)
    function isSameDate(a, b) {
        return a.getFullYear() === b.getFullYear() &&
               a.getMonth() === b.getMonth() &&
               a.getDate() === b.getDate();
    }

    // posts 배열의 date("2026.10.25")와 비교해서 해당 날짜에 글이 있는지 확인
    function hasPostOn(date) {
        return posts.some(function(post) {
            const parts = post.date.split(".").map(Number);
            if (parts.length < 3) return false;
            const postDate = new Date(parts[0], parts[1] - 1, parts[2]);
            return isSameDate(postDate, date);
        });
    }

    // 해당 날짜가 속한 주의 일요일 반환
    function getWeekStart(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - d.getDay());
        return d;
    }

    // 주간 캘린더 렌더링
    function renderWeekView() {
        const weekStart = getWeekStart(currentDate);
        const today = new Date();

        weekView.innerHTML = "";

        for (let i = 0; i < 7; i++) {
            const day = new Date(weekStart);
            day.setDate(weekStart.getDate() + i);

            const dayEl = document.createElement("div");
            dayEl.className = "day-cell";
            if (isSameDate(day, today)) dayEl.classList.add("today");
            if (day.getDay() === 0) dayEl.classList.add("sunday");
            if (day.getDay() === 6) dayEl.classList.add("saturday");

            const numEl = document.createElement("span");
            numEl.className = "day-number";
            numEl.textContent = day.getDate();

            dayEl.append(numEl);

            if (hasPostOn(day)) {
                const dot = document.createElement("span");
                dot.className = "day-dot";
                dayEl.appendChild(dot);
            }

            weekView.appendChild(dayEl);
        }

        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);

        calendarLabel.textContent =
            `${weekStart.getFullYear()}년 ${weekStart.getMonth() + 1}월 ${weekStart.getDate()}일 - ${weekEnd.getMonth() + 1}월 ${weekEnd.getDate()}일`;
    }

    // 월간 캘린더 렌더링 (6주 = 42칸 고정)
    function renderMonthView() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const today = new Date();

        const firstDay = new Date(year, month, 1);
        const startDate = getWeekStart(firstDay);

        monthGrid.innerHTML = "";

        for (let i = 0; i < 42; i++) {
            const day = new Date(startDate);
            day.setDate(startDate.getDate() + i);

            const dayEl = document.createElement("div");
            dayEl.className = "month-cell";
            if (day.getMonth() !== month) dayEl.classList.add("other-month");
            if (isSameDate(day, today)) dayEl.classList.add("today");

            const numEl = document.createElement("span");
            numEl.className = "day-number";
            numEl.textContent = day.getDate();
            dayEl.appendChild(numEl);

            if (hasPostOn(day)) {
                const dot = document.createElement("span");
                dot.className = "day-dot";
                dayEl.appendChild(dot);
            }

            monthGrid.appendChild(dayEl);
        }

        calendarLabel.textContent = `${year}년 ${month + 1}월`;
    }

    // 현재 viewMode에 맞게 화면 갱신
    function render() {
        if (viewMode === "week") {
            weekView.style.display = "grid";
            monthView.style.display = "none";
            renderWeekView();
        } else {
            weekView.style.display = "none";
            monthView.style.display = "block";
            renderMonthView();
        }
    }

    // 이전 버튼: 주간이면 -7일, 월간이면 -1달
    prevBtn.addEventListener("click", function() {
        if (viewMode === "week") {
            currentDate.setDate(currentDate.getDate() - 7);
        } else {
            currentDate.setMonth(currentDate.getMonth() - 1);
        }
        render();
    });

    // 다음 버튼: 주간이면 +7일, 월간이면 +1달
    nextBtn.addEventListener("click", function() {
        if (viewMode === "week") {
            currentDate.setDate(currentDate.getDate() + 7);
        } else {
            currentDate.setMonth(currentDate.getMonth() + 1);
        }
        render();
    });

    // 주간 <-> 월간 전환 버튼
    toggleViewBtn.addEventListener("click", function() {
        viewMode = (viewMode === "week") ? "month" : "week";
        toggleViewBtn.textContent = (viewMode === "week") ? "월간 보기" : "주간 보기";
        render();
    });

    render();
}

</script>
</head>
<body>
    <header class="header">
        <h1 class="logo">Dearly.</h1>

        <nav class="menu">
            <a href="index.html">HoMe</a>
            <a href="plan.html">PlAn</a>
            <a href="diary.html">DiArY</a>
            <a href="list.html">LiSt</a>
        </nav>

        <div class="header-actions">
            <button class="write-button" onclick="location.href='write.html'">
                + 오늘의 일기 쓰기
            </button>
            <button class="icon-button active" title="비밀 일기">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </button>
            <button class="icon-button" title="감정 쓰레기통" onclick="location.href='trash.html'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- 잠금 화면: 비밀번호를 맞추기 전까지 보이는 영역 -->
        <div id="lockScreen" class="placeholder-box">
            <h2>🔒 비밀 일기</h2>
            <p>비밀번호를 입력하면 나만의 비밀 일기를 볼 수 있어요.</p>
            <p style="font-size:12px; color:#aaa;">(지금은 스켈레톤 단계라 임시 비밀번호 1234 로 테스트해보세요)</p>
            <br>
            <input type="password" id="pwInput" placeholder="비밀번호 입력"
                   style="padding:10px 14px; border:1px solid #e9e7e0; border-radius:8px; width:200px;">
            <br><br>
            <button class="write-button" id="unlockBtn">확인</button>
            <p id="pwError" style="color:#e65050; font-size:13px; display:none;">비밀번호가 틀렸어요.</p>
        </div>

        <!-- 잠금 해제 후 보이는 비밀 일기 작성 영역 -->
        <section id="secretArea" style="display:none;">
            <div class="section-header">
                <div>
                    <h2>나만 보는 비밀 일기</h2>
                    <p>여기에 적은 내용은 나만 볼 수 있어요</p>
                </div>
            </div>

            <textarea id="secretNoteInput" rows="8" placeholder="오늘 하루, 아무도 모르게 적어보세요."
                      style="width:100%; padding:16px; border:1px solid #e9e7e0; border-radius:10px; font-family:inherit; font-size:14px;"></textarea>
            <br><br>
            <button class="write-button" id="saveSecretBtn">저장하기</button>

            <div id="secretNoteList" style="margin-top:24px;"></div>
        </section>
    </main>

    <footer>
        <p>Dearly. &copy; 2026</p>
    </footer>

    <script>
        // ===== 비밀 일기 스켈레톤 로직 =====
        // TODO: 실제 서비스에서는 비밀번호를 서버에서 검증하도록 교체해야 합니다.
        const DEMO_PASSWORD = "1234";

        const lockScreen = document.querySelector("#lockScreen");
        const secretArea = document.querySelector("#secretArea");
        const pwInput = document.querySelector("#pwInput");
        const pwError = document.querySelector("#pwError");
        const unlockBtn = document.querySelector("#unlockBtn");
        const saveSecretBtn = document.querySelector("#saveSecretBtn");
        const secretNoteInput = document.querySelector("#secretNoteInput");
        const secretNoteList = document.querySelector("#secretNoteList");

        function unlock() {
            if (pwInput.value === DEMO_PASSWORD) {
                lockScreen.style.display = "none";
                secretArea.style.display = "block";
                renderSecretNotes();
            } else {
                pwError.style.display = "block";
            }
        }

        unlockBtn.addEventListener("click", unlock);
        pwInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") unlock();
        });

        function getSecretNotes() {
            return JSON.parse(localStorage.getItem("secretNotes") || "[]");
        }

        function renderSecretNotes() {
            const notes = getSecretNotes();
            secretNoteList.innerHTML = "";
            notes.slice().reverse().forEach(function(note) {
                const card = document.createElement("div");
                card.className = "post-card";
                card.style.marginBottom = "12px";
                const date = document.createElement("p");
                date.className = "post-date";
                date.textContent = note.date;
                const content = document.createElement("p");
                content.className = "post-content";
                content.textContent = note.content;
                card.append(date, content);
                secretNoteList.appendChild(card);
            });
        }

        saveSecretBtn.addEventListener("click", function() {
            if (!secretNoteInput.value.trim()) return;
            const notes = getSecretNotes();
            notes.push({
                content: secretNoteInput.value.trim(),
                date: new Date().toLocaleString("ko-KR")
            });
            localStorage.setItem("secretNotes", JSON.stringify(notes));
            secretNoteInput.value = "";
            renderSecretNotes();
        });
    </script>
</body>
